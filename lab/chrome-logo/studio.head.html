<title>Chrome Logo Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen studio — live chrome stage on the left, a narrow control rail on the right; stacks on phones. Single dark look on purpose: chrome is shot on black. */
:root{
  --bg:#0a0b0d;          /* studio black, faint blue bias */
  --rail:#111316;
  --line:#22262c;
  --fg:#e8eaed;
  --mute:#878c95;
  --chrome:#cdd8e6;      /* cool chrome highlight = accent */
  --font-ui:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px;box-sizing:border-box}
*{box-sizing:border-box}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:16px}
.stage{position:relative;min-width:0;border-radius:14px;overflow:hidden;background:var(--stage, #000);
  border:1px solid var(--line);display:grid;place-items:center}
.stage.transparent{background:
  conic-gradient(#15171a 25%, #1b1e22 0 50%, #15171a 0 75%, #1b1e22 0) 0 0/22px 22px}
.stage chrome-logo{width:min(100%, 100%);height:100%;aspect-ratio:auto;max-width:100%}
.stage .tag{position:absolute;left:14px;top:12px;font:500 11px/1 var(--font-num);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);pointer-events:none}
.stage .hint{position:absolute;right:14px;bottom:12px;font:12px var(--font-ui);color:var(--mute);pointer-events:none}

.rail{min-width:0;overflow:auto;background:var(--rail);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column}
.rail header{padding:16px 16px 12px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rail h1{margin:0;font:600 15px/1.2 var(--font-ui);letter-spacing:-.01em}
.rail header button{font:500 12px var(--font-ui)}
section{padding:14px 16px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
section h2{margin:0;font:500 11px/1 var(--font-num);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}

.presets{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:5px 11px;font:500 12px var(--font-ui);cursor:pointer}
.chip:hover{border-color:#3a3f47}
.chip[aria-pressed="true"]{background:var(--chrome);color:#0a0b0d;border-color:var(--chrome)}

.row{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.row label{font-size:13px}
.row output{font:12px var(--font-num);color:var(--mute);font-variant-numeric:tabular-nums;min-width:4ch;text-align:right}
.row input[type=range]{grid-column:1/-1}
.row .sub{grid-column:1/-1;margin-top:-4px;font-size:12px;color:var(--mute)}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--chrome) var(--p,50%),var(--line) var(--p,50%));border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:var(--line);border-radius:2px}
input[type=range]::-moz-range-progress{height:2px;background:var(--chrome)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-6px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#b9c3cf 45%,#5d6570 100%);border:0;box-shadow:0 0 0 1px #0006}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#fff,#b9c3cf 45%,#5d6570 100%)}
input:focus-visible,button:focus-visible{outline:2px solid var(--chrome);outline-offset:2px}

.inline{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{appearance:none;border:0;background:transparent;color:var(--fg);padding:5px 9px;font:500 12px var(--font-ui);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:#23272d}
input[type=color]{width:30px;height:24px;border:1px solid var(--line);border-radius:6px;background:transparent;padding:1px;cursor:pointer}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.switch input{accent-color:var(--chrome);width:15px;height:15px}

.code{position:relative}
pre{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font:12px/1.55 var(--font-num);color:var(--fg);white-space:pre-wrap;word-break:break-word;max-height:190px;overflow:auto}
.btn{appearance:none;border:1px solid var(--line);background:#1a1d21;color:var(--fg);border-radius:8px;padding:7px 12px;font:500 12px var(--font-ui);cursor:pointer}
.btn:hover{border-color:#3a3f47}
.btn.primary{background:var(--chrome);color:#0a0b0d;border-color:var(--chrome)}
.actions{display:flex;gap:8px;align-items:center}
.toast{font-size:12px;color:var(--mute)}
.ghost{appearance:none;border:0;background:none;color:var(--mute);cursor:pointer;padding:2px 0}
.ghost:hover{color:var(--fg)}

@media (max-width:820px){
  .app{grid-template-columns:1fr;height:auto}
  html,body{height:auto}
  .stage{aspect-ratio:1/1;max-width:100%}
  .rail{overflow:visible}
}
@media (prefers-reduced-motion: reduce){ .hint{display:none} }
</style>
